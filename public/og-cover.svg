<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="RAI's birthday dreamland">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9ec"/>
      <stop offset="45%" stop-color="#efe2ff"/>
      <stop offset="100%" stop-color="#d8ecff"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9ec4"/>
      <stop offset="55%" stop-color="#ff7fae"/>
      <stop offset="100%" stop-color="#b79cff"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8b48c"/>
      <stop offset="100%" stop-color="#d79a72"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- soft clouds -->
  <g fill="#ffffff" opacity="0.65">
    <ellipse cx="170" cy="130" rx="120" ry="46"/>
    <ellipse cx="250" cy="120" rx="90" ry="38"/>
    <ellipse cx="1030" cy="180" rx="140" ry="50"/>
    <ellipse cx="930" cy="160" rx="90" ry="36"/>
    <ellipse cx="640" cy="70" rx="150" ry="40"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="330" cy="150" r="5"/>
    <circle cx="420" cy="90" r="3.5"/>
    <circle cx="760" cy="140" r="4.5"/>
    <circle cx="880" cy="250" r="3"/>
    <circle cx="250" cy="300" r="3.5"/>
    <circle cx="980" cy="380" r="4"/>
  </g>

  <!-- moon -->
  <circle cx="1020" cy="120" r="66" fill="#fff6e2" opacity="0.95"/>
  <circle cx="1020" cy="120" r="110" fill="url(#glow)" opacity="0.5"/>

  <!-- big heart logo -->
  <g transform="translate(430 190) scale(5.2)">
    <circle cx="18" cy="16" r="9" fill="url(#ear)"/>
    <circle cx="46" cy="16" r="9" fill="url(#ear)"/>
    <circle cx="18" cy="16" r="4.4" fill="#ffb9cd"/>
    <circle cx="46" cy="16" r="4.4" fill="#ffb9cd"/>
    <path d="M32 55C13 41 6 30 11.5 22.5 16 16 25 15.5 32 22.5 39 15.5 48 16 52.5 22.5 58 30 51 41 32 55Z" fill="url(#heart)"/>
    <circle cx="25" cy="31" r="2.7" fill="#4a3040"/>
    <circle cx="39" cy="31" r="2.7" fill="#4a3040"/>
    <ellipse cx="20" cy="36" rx="3.5" ry="2.3" fill="#ff7fae" opacity="0.7"/>
    <ellipse cx="44" cy="36" rx="3.5" ry="2.3" fill="#ff7fae" opacity="0.7"/>
  </g>

  <!-- text -->
  <text x="600" y="545" text-anchor="middle" font-family="Pacifico, Segoe Script, cursive" font-size="86" fill="#e64e8d">RAI &#10084;</text>
  <text x="600" y="596" text-anchor="middle" font-family="Fredoka, Trebuchet MS, sans-serif" font-size="28" fill="#6b5279">A little birthday dreamland &#183; 24 October &#183; made by Ayaan</text>
</svg>
