<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="RAI birthday dreamland">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe3f1"/>
      <stop offset="100%" stop-color="#e6dcff"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9ec4"/>
      <stop offset="55%" stop-color="#ff7fae"/>
      <stop offset="100%" stop-color="#b79cff"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8b48c"/>
      <stop offset="100%" stop-color="#d79a72"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- bear ears -->
  <circle cx="18" cy="16" r="9" fill="url(#ear)"/>
  <circle cx="46" cy="16" r="9" fill="url(#ear)"/>
  <circle cx="18" cy="16" r="4.4" fill="#ffb9cd"/>
  <circle cx="46" cy="16" r="4.4" fill="#ffb9cd"/>

  <!-- heart face -->
  <path d="M32 55C13 41 6 30 11.5 22.5 16 16 25 15.5 32 22.5 39 15.5 48 16 52.5 22.5 58 30 51 41 32 55Z" fill="url(#heart)"/>

  <!-- eyes -->
  <circle cx="25" cy="31" r="2.7" fill="#4a3040"/>
  <circle cx="39" cy="31" r="2.7" fill="#4a3040"/>
  <circle cx="25.9" cy="30.1" r="0.9" fill="#ffffff"/>
  <circle cx="39.9" cy="30.1" r="0.9" fill="#ffffff"/>

  <!-- cheeks -->
  <ellipse cx="20" cy="36" rx="3.5" ry="2.3" fill="#ff7fae" opacity="0.7"/>
  <ellipse cx="44" cy="36" rx="3.5" ry="2.3" fill="#ff7fae" opacity="0.7"/>

  <!-- tiny nose -->
  <path d="M32 35.4c-1.3 0-2.2.9-2.2 1.9 0 .9 1 1.6 2.2 1.6s2.2-.7 2.2-1.6c0-1-.9-1.9-2.2-1.9z" fill="#4a3040" opacity="0.75"/>
</svg>
